<!DOCTYPE html>
<html>
  <head>
    <title>Highchart</title>

    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/modules/series-label.js"></script>
    <script src="https://code.highcharts.com/modules/exporting.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highcharts@12/highcharts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highcharts@12/modules/series-label.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highcharts@12/modules/exporting.js"></script>

    <style>
        #container {
            min-width: 310px;
            max-width: 800px;
            height: 400px;
            margin: 0 auto
        }
    </style>
  </head>
  <body>
     <div id="chart"></div>

     <script>Highcharts.chart('chart', {

    title: { text: 'Weekly Temperature Forecast in College Station' },
    xAxis: { categories: ['Sat', 'Sun', 'Mon', 'Tue', 'Wed', 'Thur', 'Fri', 'Sat']},
    yAxis: { title: { text: 'Temperature (°F)' } },
    legend: { layout: 'vertical', align: 'center', verticalAlign: 'bottom', layout: 'horizontal' },
    plotOptions: { series: { label: { connectorAllowed: false }, pointStart: 0} },

    series: [{
        name: 'Highest',
        data: [82, 81, 81, 70, 77, 78, 79, 80]
    }, {
        name: 'Lowest',
        data: [67, 59, 50, 47, 51, 60, 66, 66]
    }],

    responsive: {
        rules: [{
            condition: {
                maxWidth: 500
            },
            chartOptions: {
                legend: {
                    layout: 'horizontal',
                    align: 'center',
                    verticalAlign: 'bottom'
                }
            }
        }]
    }

}); 
    </script>
  </body>
</html>
